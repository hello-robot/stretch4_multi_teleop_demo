voice_commands:
  - keyword: "gripper"
    action: "toggle"
  - keyword: "open"
    action: "tap"
  - axis: "lift"
    action: "step"
    up: "up"
    down: "down"
    step: 0.1
  - axis: "arm"
    action: "scale"
    min: -10.0
    max: 10.0
  - axis: "go to"
    action: "scale"
    min: -3.0
    max: 3.0
